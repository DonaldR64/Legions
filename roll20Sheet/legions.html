<script type="text/worker">
    const buttonlist = ["input","display","abilities"];
    buttonlist.forEach(button => {
        on(`clicked:${button}`, function() {
            setAttrs({
                sheetTab: button
            });
        });
    });

    on("sheet:opened", function() {
        setAttrs({sheetTab:"display"});
    });

    on("change:attrs sheet:opened", function() { 
        getAttrs(["special","type"], function(values) {
            let type = values.type;
            let scale = 1;
            if (type === "Vehicle") {scale = 2};
            if (type === "Super-Heavy Vehicle") {scale=3};
            if (type === "Knight") {scale = 4};
            if (type === "Titan") {scale = 5};


            let special = values.special;
            special = special.split(",");

            setAttrs({
                "scale": scale,
                "special0": special[0],
                "special1": special[1],
                "special2": special[2],
                "special3": special[3],
                "special4": special[4],
                "special5": special[5],
                "special6": special[6],
                "special7": special[7],



            });
        });    
    }); 


 

</script>
